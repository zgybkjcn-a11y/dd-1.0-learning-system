name: Portable tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Install pinned Chromium and Chinese fonts
        run: |
          python -m playwright install --with-deps --no-shell chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit and contract tests
        run: python -m pytest tests -q -m "not browser and not local_materials" --junitxml=test-results/unit.xml
      - name: Required browser tests
        run: python -m pytest tests -q -m browser --junitxml=test-results/browser.xml
      - name: Save synthetic test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-test-results-python312
          path: test-results/*.xml
          if-no-files-found: ignore
