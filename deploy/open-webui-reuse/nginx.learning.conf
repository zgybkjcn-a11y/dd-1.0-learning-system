worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 25m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Built-in WebUI login uses only token; learning cookies never reach WebUI.
    map $cookie_token $webui_cookie { default "token=$cookie_token"; '' ''; }
    server {
        listen 443 ssl;
        server_name 172.19.116.53;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        location = /learning { return 303 /learning/ui; }
        location ^~ /learning/ {
            set $gateway http://learning-gateway:8000;
            proxy_pass $gateway;
            proxy_read_timeout 35s;
            proxy_set_header Connection close;
            proxy_set_header Host 172.19.116.53;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Adapter-Secret "";
            proxy_set_header X-Admin-Secret "";
            proxy_set_header X-Account-Id "";
            proxy_set_header X-Learner-Id "";
            proxy_set_header X-Trusted-Subject "";
            proxy_set_header X-Trusted-Provider "";
            proxy_set_header X-Trusted-Issuer "";
            proxy_set_header X-Forwarded-Prefix "";

            # Preserve Origin and __Host- Cookie paths; gateway checks identity.
        }
        location / {
            set $webui http://open-webui:8080;
            proxy_pass $webui;
            proxy_set_header Host 172.19.116.53;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Adapter-Secret "";
            proxy_set_header X-Admin-Secret "";
            proxy_set_header X-Account-Id "";
            proxy_set_header X-Learner-Id "";
            proxy_set_header X-Trusted-Subject "";
            proxy_set_header X-Trusted-Provider "";
            proxy_set_header X-Trusted-Issuer "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header Cookie $webui_cookie;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
